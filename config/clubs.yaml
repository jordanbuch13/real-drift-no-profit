# Listed football clubs in the study universe.
#
# football_data_name: exact spelling in football-data.co.uk files.
# betfair_names: exact team spellings used in Betfair event names ("Home v Away").
# openfootball_names: spellings in the openfootball European fixture files (country tag removed).
# oddsportal_names: spellings on OddsPortal (data/raw/oddsportal), verified on the scraped files 2026-10-06.
# wikipedia_name: the club as in English Wikipedia season article titles ("2016–17 FC Porto season").
# ticker, exchange, benchmark: Yahoo Finance ticker of the club's listed company, its exchange (exchanges below)
# and the local index used as benchmark (Step 3). STOXX Europe 600 (^STOXX) is the robustness benchmark.
# oddsportal_id: the team id in OddsPortal match links (h2h/<slug>-<id>/...), used to pick the clubs' matches
# out of competition link lists.
# football_data_name verified against the raw files on 2026-10-05. The first betfair_names entry of
# every club verified against real Betfair Basic files on 2026-10-06 (exact match on the team
# name). Step 1 and Step 1b print warnings with close matches when a name is never found.
# Fix names here, never in code.

seasons:
  first: "1213"   # Man Utd NYSE listing, August 2012
  last: "2526"    # last complete season

# Matches per team in a normal season. Step 1 warns about any league season that differs
# and has no entry in season_notes.
league_matches_per_team:
