    - {league: I1, season: "1415", team: Parma, date: "2014-12-09", points: -1, reason: "unpaid wages (FIGC)"}
    - {league: I1, season: "1415", team: Parma, date: "2015-03-13", points: -2, reason: "unpaid wages (FIGC)"}
