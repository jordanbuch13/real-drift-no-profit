# Step 3: exchanges. Close is the end of continuous trading in local time; a match that ends
# before it affects that day's close. close_times lists changes with the date they took effect.
# Istanbul's history is to verify; matches ending within an hour of the close are flagged.
robustness_benchmark: "^STOXX"
exchanges:
  NYSE:  {timezone: America/New_York, close_times: [{from: "2000-01-01", close: "16:00"}]}
  MIL:   {timezone: Europe/Rome, close_times: [{from: "2000-01-01", close: "17:30"}]}
  XETRA: {timezone: Europe/Berlin, close_times: [{from: "2000-01-01", close: "17:30"}]}
  AMS:   {timezone: Europe/Amsterdam, close_times: [{from: "2000-01-01", close: "17:30"}]}
  PAR:   {timezone: Europe/Paris, close_times: [{from: "2000-01-01", close: "17:30"}]}
  LIS:   {timezone: Europe/Lisbon, close_times: [{from: "2000-01-01", close: "16:30"}]}
  LSE:   {timezone: Europe/London, close_times: [{from: "2000-01-01", close: "16:30"}]}
  IST:   {timezone: Europe/Istanbul, close_times: [{from: "2000-01-01", close: "17:30"}, {from: "2015-11-30", close: "18:00"}]}

# Step 3: corporate actions Yahoo Finance gets wrong. Bloomberg CACS (retrieved 2026-10-08) shows
# paid rights issues of the Turkish clubs. Yahoo applies each adjustment on the wrong date (`date`,
# about a week before the ex-date) and only to later prices, which leaves one fake crash. Prices
# before `date` are multiplied by Bloomberg's adjustment factor; with it the return on `date`
# comes out small (-5.9% to +4.0%), so Yahoo used the same factor and the return is kept. An entry
# without a factor would have prices before divided by the jump and that day's return excluded.
corporate_actions:
  - {ticker: BJKAS.IS, date: "2024-07-03", ex_date: "2024-07-03", factor: 0.223881, reason: "rights issue 400 per 100 at TRY 1 (Bloomberg CACS 237825303)"}
  - {ticker: BJKAS.IS, date: "2025-04-07", ex_date: "2025-04-16", factor: 0.740541, reason: "rights issue 400 per 100 at TRY 2 (Bloomberg CACS 241709291)"}
  - {ticker: FENER.IS, date: "2024-12-09", ex_date: "2024-12-17", factor: 0.430243, reason: "rights issue 152.58 per 100 at TRY 6 (Bloomberg CACS 240506333)"}
  - {ticker: FENER.IS, date: "2025-06-23", ex_date: "2025-06-30", factor: 0.216488, reason: "rights issue 400 per 100 at TRY 1 (Bloomberg CACS 242621727)"}
  - {ticker: FENER.IS, date: "2025-12-29", ex_date: "2026-01-05", factor: 0.37094, reason: "rights issue 400 per 100 at TRY 2 (Bloomberg CACS 244903404)"}
  - {ticker: GSRAY.IS, date: "2024-12-23", ex_date: "2024-12-30", factor: 0.326984, reason: "rights issue 400 per 100 at TRY 1 (Bloomberg CACS 240647684)"}
  - {ticker: GSRAY.IS, date: "2025-06-30", ex_date: "2025-07-07", factor: 0.752941, reason: "rights issue 150 per 100 at TRY 1 (Bloomberg CACS 242705762)"}
  # Juventus and Roma (Bloomberg CACS, 2026-10-08). JUVE 29/11/2021 (9 per 10 at EUR 0.334, factor
  # 0.801704, CACS 228500564) is adjusted correctly by Yahoo (no jump), so it is not listed. Lyon:
  # no rights issues in CACS 2011-2026.
  - {ticker: JUVE.MI, date: "2024-03-04", ex_date: "2024-03-11", factor: 0.853664, reason: "rights issue 1 per 2 at EUR 1.582 (Bloomberg CACS 237549327); Yahoo's -14.5% becomes +0.1% (market -0.1%)"}
  - {ticker: "ASR EU Equity", date: "2014-06-30", ex_date: "2014-06-30", factor: null, reason: "rights issue 2 per 1 at EUR 0.377, factor 0.595138 (Bloomberg CACS 92970997). Bloomberg's own series is adjusted but shows +30% on the ex-date, so the adjustment may be misplaced; the day's return is excluded (off-season, no match nearby)"}

# Step 4 split E1 (stakes), src/league_tables.py. A league match is late if it is one of the club's
# last `last_rounds` scheduled league matches, and has stakes if, on the morning of the match, the
# club is within `within_points` of the title line, the last Champions League place or the first
# relegation place. Places per league and season come from the Wikipedia final tables
# (data/raw/wikipedia_leagues/), ex ante: any Champions League round counts, relegation play-off
# places count, European Performance Spots (known only late in the season) do not. Decided
# 2026-10-09; the Scottish split is ignored (places across the split line still count).
e1_stakes:
  last_rounds: 10
  within_points: 6
  # Extra Champions League place from UEFA's European Performance Spot (footnotes of the articles).
  european_performance_spots:
    - {league: D1, season: "2324", reason: "Germany one of the two best associations in 2023-24"}
    - {league: I1, season: "2324", reason: "Italy one of the two best associations in 2023-24"}
    - {league: E0, season: "2425", reason: "England one of the two best associations in 2024-25"}
    - {league: E0, season: "2526", reason: "England one of the two best associations in 2025-26"}
  # Ex ante places where the Wikipedia table shows something else.
  place_overrides:
    - {league: T1, season: "1314", last_cl: 2, reason: "champions Fenerbahce banned by UEFA, so 1st shows no CL note; two CL places by coefficient"}
    - {league: T1, season: "1920", last_cl: 2, reason: "2nd Trabzonspor banned by UEFA; two CL places by coefficient"}
    - {league: I1, season: "2223", first_rel: 18, reason: "17th and 18th level on points played a tie-breaker (Spezia v Verona); 18th was the first relegation place"}
    - {league: F1, season: "1920", first_rel: 18, reason: "abandoned (Covid), 2 relegated and no play-off; the play-off place (18th) was scheduled"}
    - {league: SC0, season: "1920", first_rel: 11, reason: "ended early (Covid), no play-off; the play-off place (11th) was scheduled"}
    - {league: P1, season: "1920", first_rel: 17, reason: "Setubal (16th) and Aves (18th) relegated on licences, Portimonense (17th) stayed up; 2 sporting relegation places were scheduled"}
  # Point deductions, counted in the table from `date` (the decision). They add up to Wikipedia's
  # points minus 3·W + D per club (checked in the code). Names as in football-data.
  deductions:
    - {league: E0, season: "2324", team: Everton, date: "2023-11-17", points: -10, reason: "PSR breach (Premier League statement)"}
    - {league: E0, season: "2324", team: Everton, date: "2024-02-26", points: 4, reason: "appeal cut the deduction to 6 (BBC)"}
    - {league: E0, season: "2324", team: Everton, date: "2024-04-08", points: -2, reason: "second PSR breach (Sky Sports)"}
    - {league: E0, season: "2324", team: "Nott'm Forest", date: "2024-03-18", points: -4, reason: "PSR breach (Guardian)"}
    - {league: F1, season: "1213", team: Ajaccio, date: "2012-08-09", points: -2, reason: "crowd trouble in 2011-12 v Lyon (LFP, Eurosport)"}
    - {league: F1, season: "2122", team: Nice, date: "2021-09-08", points: -1, reason: "Nice v Marseille abandoned, crowd trouble (LFP, 2 points with 1 suspended)"}
    - {league: F1, season: "2122", team: Lyon, date: "2021-12-08", points: -1, reason: "Lyon v Marseille abandoned, crowd trouble (BBC)"}
    - {league: F1, season: "2324", team: Montpellier, date: "2023-10-25", points: -1, reason: "Montpellier v Clermont abandoned, firecracker (LFP, 2 points with 1 suspended)"}
    - {league: I1, season: "1213", team: Sampdoria, date: "2012-08-01", points: -1, reason: "2011-12 betting scandal, decided before the season"}
    - {league: I1, season: "1213", team: Torino, date: "2012-08-01", points: -1, reason: "2011-12 betting scandal, decided before the season"}
