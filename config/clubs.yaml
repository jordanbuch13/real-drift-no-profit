# Step 1b friendly filter. Betfair Basic files do not name the competition, so a Betfair match
# that is neither a Step 1 league match nor in the openfootball European fixture list is treated
# as a friendly if it falls in the club's off-season (from off_season_buffer_days after its last
# league match of a season to its first league match of the next) or winter break (a gap of at
# least winter_break_min_days between league matches that overlaps mid December to mid February).
# Clubs under date_rule_exempt, and dates under date_rule_exempt_periods, keep those matches.
friendly_filter:
  winter_break_min_days: 18
  off_season_buffer_days: 14   # keeps cup finals just after the league ends (July 2020 Covid finals)
  two_leg_max_days: 14         # same opponent home and away within this many days: a qualifier, kept
  # In a winter break, a match against a team from the club's own league is a cup tie and kept,
  # except in these leagues, whose clubs play domestic sides at winter training camps.
  winter_camp_friendly_leagues: [D1, N1]
  # No exempt periods: the 2025 FIFA Club World Cup matches are named from OddsPortal and Wikipedia,
  # so the date rules no longer reach them (the exemption, removed 2026-10-08, only kept friendlies).
  date_rule_exempt_periods: []
  date_rule_exempt:
    - {club: Celtic, reason: "Champions League and Europa League qualifiers start in July, before the Scottish season; openfootball only lists qualifiers from 2024/25"}

